/* ───────── tokens ─────────
   Spacing and sizes step along the Fibonacci row (3 5 8 13 21 34 55 89);
   the main splits are golden (38.2 / 61.8). */
:root{
  --night:#070a16;
  --ivory:#e9e1cb;
  --ivory-2:rgba(233,225,203,.72);
  --ivory-3:rgba(233,225,203,.52);
  --hair:rgba(233,225,203,.09);
  --retro:#a78bfa;                       /* nebula violet marks everything retrograde */
  --retro-hi:#cdbfff;
  --retro-2:rgba(167,139,250,.5);
  --serif:"Noto Serif Georgian",Georgia,"Times New Roman",serif;
  --sans:"Noto Sans Georgian",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --tabs:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:
    radial-gradient(120% 70% at 78% -12%,rgba(56,66,128,.30) 0%,rgba(56,66,128,0) 62%),
    radial-gradient(90% 60% at 8% 108%,rgba(40,34,84,.26) 0%,rgba(40,34,84,0) 60%),
    var(--night);
  color:var(--ivory);
  font:400 13px/1.4 var(--sans);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:1px solid var(--ivory);outline-offset:2px;border-radius:3px}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* ───────── pager ───────── */
#pager{
  position:fixed;inset:0;display:flex;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
#pager::-webkit-scrollbar{display:none}
.page{
  flex:0 0 100%;height:100%;
  scroll-snap-align:start;scroll-snap-stop:always;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:calc(var(--sat) + 8px) 13px calc(var(--sab) + var(--tabs) + 5px);
}
.page::-webkit-scrollbar{display:none}

/* top line of every page: date on the left, language switch on the right */
.bar{display:flex;align-items:center;justify-content:space-between;height:34px}
.date{margin:0;font:400 11px/16px var(--sans);color:var(--ivory-2)}
.lang{display:flex;border:1px solid rgba(233,225,203,.2);border-radius:13px;overflow:hidden}
.lang button{height:24px;padding:0 9px;font:600 10px/24px var(--sans);letter-spacing:.05em;color:var(--ivory-3)}
.lang button[aria-pressed="true"]{background:var(--ivory);color:var(--night)}

/* ───────── tabs ───────── */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  height:calc(var(--tabs) + var(--sab));padding-bottom:var(--sab);
  display:flex;
  background:rgba(7,10,22,.9);border-top:1px solid var(--hair);
  -webkit-backdrop-filter:blur(13px);backdrop-filter:blur(13px);
}
#tabs button{
  flex:1;position:relative;
  font:400 12px/1 var(--sans);color:var(--ivory-3);
  transition:color .25s;
}
#tabs button::before{
  content:"";position:absolute;left:50%;top:8px;width:5px;height:5px;margin-left:-2.5px;
  border-radius:50%;background:var(--ivory);opacity:0;transition:opacity .25s;
}
#tabs button span{position:relative;top:5px}
#tabs button[aria-current="true"]{color:var(--ivory)}
#tabs button[aria-current="true"]::before{opacity:1}

/* ───────── zodiac glyphs, planet pictures, retrograde badge ───────── */
.zg{flex:none;width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1.5px}
/* .pl-Name rules (size ratio and picture) are added by the script; --s is the planet's disc diameter */
.pl{display:inline-block;flex:none;background-size:100% 100%;background-repeat:no-repeat;vertical-align:middle}
.ic{flex:none;display:inline-flex;align-items:center;justify-content:center}
.rx{
  display:inline-block;vertical-align:1px;margin-left:5px;
  font:600 9px/13px var(--sans);color:var(--night);background:var(--retro);
  width:13px;height:13px;border-radius:50%;text-align:center;
}

/* ───────── page 1 · retrograde chart ───────── */
.chart{position:relative;margin-top:0}
.axis{position:relative;height:21px;font:400 10px/13px var(--sans);color:var(--ivory-3);white-space:nowrap}
.axis span{position:absolute;bottom:5px}
.axis .zn{left:74.04%;right:0;text-align:center;color:var(--retro-hi)}
.plot{position:relative}
.rows{position:relative;list-style:none;margin:0;padding:0;border-bottom:1px solid var(--hair)}
.grid{position:absolute;inset:0;pointer-events:none}
.grid .zone{position:absolute;top:0;bottom:0;left:74.04%;right:0;
  background:linear-gradient(180deg,rgba(138,108,255,.20),rgba(96,84,230,.09))}
.row{position:relative;display:grid;grid-template-columns:38.2% 61.8%;align-items:center;height:62px;border-top:1px solid var(--hair)}
.who{min-width:0;padding-right:8px}
.who .nm{display:block;font:600 16px/20px var(--serif);white-space:nowrap}
.who .pos{display:block;margin-top:2px;font:400 11px/14px var(--sans);color:var(--ivory-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:grid;grid-template-rows:14px 27px 14px;min-width:0}
/* the track is 58% runway + 42% retrograde zone; the label line is split at the same place:
   time until retrograde on the left, time left inside the zone */
.l1{display:grid;grid-template-columns:58% 42%;font:400 11px/14px var(--sans);color:var(--ivory-2);white-space:nowrap}
.l1 .a{display:flex;justify-content:flex-end;min-width:0;padding-right:7px}
.l1 .a b{font-weight:600;color:var(--ivory)}
.l1 .a .dim{color:var(--ivory-3)}
.l1 .b{padding-left:4px;font-weight:600;font-size:10.5px;color:var(--retro-hi)}
.l3{display:flex;justify-content:flex-end;align-items:center;gap:8px;font:400 11px/14px var(--sans);color:var(--ivory-3);white-space:nowrap;overflow:hidden}
.l3 .sg{color:var(--ivory-2);display:inline-flex;align-items:center;gap:3px}
.l3 .sg .ar{opacity:.6;margin:0 1px}
.track{position:relative;background:linear-gradient(var(--retro-2),var(--retro-2)) 58% 50%/1px 13px no-repeat}
.track::before{content:"";position:absolute;left:0;width:58%;top:50%;height:1px;margin-top:-.5px;background:rgba(233,225,203,.16)}
.track::after{content:"";position:absolute;left:58%;right:0;top:50%;height:2px;margin-top:-1px;background:var(--retro-2);border-radius:1px}
.track .go{position:absolute;top:50%;z-index:1}
.track .go.ahead{height:1px;margin-top:-.5px;background:rgba(233,225,203,.62)}
.track .go.done{height:2px;margin-top:-1px;background:var(--retro-hi);border-radius:1px;box-shadow:0 0 8px rgba(167,139,250,.8)}
.track .far{position:absolute;left:0;top:50%;width:21px;height:1px;margin-top:-.5px;z-index:1;
  background:repeating-linear-gradient(90deg,var(--night) 0 3px,transparent 3px 6px)}
.track .pl{position:absolute;top:50%;z-index:2;transform:translate(-50%,-50%);filter:drop-shadow(0 0 1.5px var(--night))}
/* Uranus' upright rings are taller than the row: let them fade out before they reach the text lines */
.track .pl-Uranus{-webkit-mask-image:linear-gradient(transparent 17%,#000 31%,#000 69%,transparent 83%);mask-image:linear-gradient(transparent 17%,#000 31%,#000 69%,transparent 83%)}

.lumin{display:flex;justify-content:space-between;gap:13px;margin-top:3px}
.lumin div{display:flex;align-items:center;gap:6px;height:34px;min-width:0;white-space:nowrap}
.lumin b{font:600 14px/1 var(--serif)}
.lumin span{font:400 11px/1.6 var(--sans);color:var(--ivory-2);overflow:hidden;text-overflow:ellipsis}
.lumin .ic{width:21px;height:21px;overflow:visible}
.lumin svg.mi{flex:none;margin:0 2px}

/* ───────── page 2 · moon ───────── */
.moon-hero{display:grid;grid-template-columns:38.2% 61.8%;align-items:center;margin-top:5px}
.moon-hero .disc{display:flex;justify-content:center}
.moon-hero .disc svg{width:89px;height:89px;filter:drop-shadow(0 0 13px rgba(233,225,203,.10))}
.moon-hero h2{margin:0 0 5px;font:600 21px/1.2 var(--serif)}
.kv{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:13px;row-gap:3px;font:400 12px/16px var(--sans)}
.kv dt{color:var(--ivory-3)}
.kv dd{margin:0;color:var(--ivory);white-space:nowrap}

.fullrow{display:flex;align-items:center;gap:8px;height:34px;margin-top:13px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  font:400 12px/1.6 var(--sans);color:var(--ivory);white-space:nowrap}
.fullrow b{font:600 14px/1 var(--serif);margin-right:auto}
.fullrow .sg{display:inline-flex;align-items:center;gap:3px;color:var(--ivory-2)}
.fullrow .dim{color:var(--ivory-3)}
.fullrow svg.mi{flex:none}

.cycle{position:relative;height:60px;margin:16px 21px 0}
.cycle .line{position:absolute;left:0;right:0;top:9px;height:1px;background:rgba(233,225,203,.16)}
.cycle .line i{position:absolute;left:0;top:0;height:1px;background:rgba(233,225,203,.62)}
.cycle .ev{position:absolute;top:0;width:60px;margin-left:-30px;text-align:center;font:400 11px/14px var(--sans);color:var(--ivory-2)}
.cycle .ev svg.mi{display:block;margin:2px auto 5px;border-radius:50%;box-shadow:0 0 0 3px var(--night)}
.cycle .ev .zg{display:block;margin:2px auto 0;color:var(--ivory-3)}
.cycle .ev.next{color:var(--ivory)}
.cycle .ev.next .zg{color:var(--ivory-2)}
.cycle .ev.past{color:var(--ivory-3)}
.cycle .now{position:absolute;top:9px;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--ivory);box-shadow:0 0 0 2px var(--night),0 0 8px rgba(233,225,203,.5);z-index:2}

.cal{margin-top:5px}
.cal-h{display:flex;align-items:center;justify-content:space-between;height:34px}
.cal-h b{font:600 16px/1 var(--serif)}
.cal-h button{width:34px;height:34px;display:grid;place-items:center;color:var(--ivory-2)}
.cal-h button svg{width:8px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-w span{font:400 10px/16px var(--sans);color:var(--ivory-3);text-align:center}
.cal-g{border-top:1px solid var(--hair)}
.cal-g button,.cal-g i{height:36px;border-bottom:1px solid var(--hair)}
.cal-g button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.cal-g .n{font:400 10px/11px var(--sans);color:var(--ivory-3)}
.cal-g .ev .n{color:var(--ivory)}
.cal-g .ev svg.mi{box-shadow:0 0 0 2px var(--night),0 0 0 3px var(--ivory-3);border-radius:50%}
.cal-g .today .n{color:var(--night);background:var(--ivory);border-radius:6px;padding:0 4px;font-weight:600}
.cal-g .sel{background:rgba(233,225,203,.06)}
.cal-d{margin:5px 0 0;min-height:34px;font:400 11px/17px var(--sans);color:var(--ivory-2)}
.cal-d b{font:600 13px/17px var(--serif);color:var(--ivory);margin-right:8px}
.cal-d span{display:block}

.lun{width:100%;margin-top:13px;border-collapse:collapse;table-layout:fixed}
.lun th{padding:0 0 5px;text-align:left;font:600 14px/1.3 var(--serif);color:var(--ivory)}
.lun th svg.mi{vertical-align:-2px;margin-right:6px}
.lun td{padding:6px 0 7px;border-top:1px solid var(--hair);vertical-align:top;font:400 11px/15px var(--sans);color:var(--ivory-2);white-space:nowrap}
.lun td b{font-weight:600;color:var(--ivory);font-size:12px}
.lun td .tm{margin-left:5px;color:var(--ivory-3)}
.lun td .sg{display:flex;align-items:center;gap:3px}

/* ───────── page 3 · sky from Earth ───────── */
.sky{position:relative;margin:0 auto;width:100%;max-width:440px;aspect-ratio:1}
.sky svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sky .rr{stroke:var(--retro);stroke-width:4.5;stroke-linecap:round}
.sky .st path,.sky .mt path{stroke-width:1.25;stroke-linecap:butt}
.sky .an{stroke-width:1.25;stroke-opacity:.66;stroke-linecap:round}
.sky .tr.on .st path,.sky .tr.on .an,.sky .tr.on .mt path{stroke-width:1.8}
.sky .tr.on .rr{stroke-width:5.5}
.sky .tr,.sky .bd{transition:opacity .2s}
/* while the year is replayed one plain line grows behind each planet; when it ends that line
   cross-fades into the resting trail, whose older part is fainter */
.sky .st{opacity:1;transition:opacity .7s}
.sky .an{opacity:0;transition:opacity .7s}
.sky svg[data-state="play"] .an{opacity:1;transition:none}
.sky svg[data-state="play"] .st,.sky svg[data-state="start"] .st{opacity:0;transition:none}
.sky svg[data-state="start"] .an{transition:none}
.legend{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;column-gap:13px;border-top:1px solid var(--hair)}
.legend li{min-width:0}
.legend button{display:flex;align-items:center;gap:8px;width:100%;height:34px;border-bottom:1px solid var(--hair);text-align:left;white-space:nowrap;min-width:0;transition:opacity .2s}
.legend .ic{width:34px;height:34px}
.legend .tx{min-width:0;display:flex;flex-direction:column;justify-content:center}
.legend b{font:600 13px/15px var(--serif)}
.legend .sg{display:flex;align-items:center;gap:3px;font:400 11px/15px var(--sans);color:var(--ivory-2);min-width:0}
.legend .sn{overflow:hidden;text-overflow:ellipsis}
.legend .rx{margin-left:5px;width:11px;height:11px;font-size:8px;line-height:11px;vertical-align:1px}
.legend.has-focus button:not(.on){opacity:.42}

/* ───────── narrow phones ───────── */
@media (max-width:369px){
  .fullrow{gap:5px;font-size:11px}
  .fullrow b{font-size:13px}
}
@media (max-width:349px){
  .page{padding-left:8px;padding-right:8px}
  .who .nm{font-size:14px}
  .who .pos,.l1,.l3{font-size:10px}
  .l1 .b{font-size:9.5px;padding-left:3px}
  .l1 .a{padding-right:5px}
  .fullrow{font-size:10px}
  .fullrow b{font-size:12px}
  .lumin b{font-size:13px}
}

/* ───────── larger screens ───────── */
@media (min-width:600px){
  .page>*{max-width:440px;margin-left:auto;margin-right:auto}
  .page>.cycle{max-width:398px}
}
@media (min-width:1280px){
  #pager{justify-content:center;gap:34px;scroll-snap-type:none}
  .page{flex:0 0 400px;padding-bottom:34px}
  .page>*{max-width:none}
  .page>.cycle{margin-left:21px;margin-right:21px}
  #pg-moon .lang,#pg-sky .lang{display:none}
  #tabs{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<svg id="stars" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>

<main id="pager">
  <section class="page" id="pg-planets">
    <div class="bar">
      <p class="date" id="date1"></p>
      <div class="lang" role="group"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ka">GE</button></div>
    </div>
    <div class="chart">
      <div class="axis" id="axis" aria-hidden="true"></div>
      <div class="plot">
        <div class="grid" aria-hidden="true"><div class="zone"></div></div>
        <ol class="rows" id="rows"></ol>
      </div>
    </div>
    <div class="lumin" id="lumin"></div>
  </section>

  <section class="page" id="pg-moon">
    <div class="bar">
      <p class="date" id="date2"></p>
      <div class="lang" role="group"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ka">GE</button></div>
    </div>
    <div class="moon-hero">
      <div class="disc" id="disc"></div>
      <div><h2 id="phase"></h2><dl class="kv" id="moonkv"></dl></div>
    </div>
    <div class="fullrow" id="fullrow"></div>
    <div class="cycle" id="cycle"></div>
    <div class="cal">
      <div class="cal-h">
        <button type="button" data-d="-1"><svg viewBox="0 0 8 13"><path d="M6.5 1L1.5 6.5 6.5 12"/></svg></button>
        <b id="cal-title"></b>
        <button type="button" data-d="1"><svg viewBox="0 0 8 13"><path d="M1.5 1L6.5 6.5 1.5 12"/></svg></button>
      </div>
      <div class="cal-w" id="cal-w" aria-hidden="true"></div>
      <div class="cal-g" id="cal-g"></div>
      <p class="cal-d" id="cal-d"></p>
    </div>
    <table class="lun" id="lun"></table>
  </section>

  <section class="page" id="pg-sky">
    <div class="bar">
      <p class="date" id="date3"></p>
      <div class="lang" role="group"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ka">GE</button></div>
    </div>
    <div class="sky"><svg id="sky" role="img" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <ul class="legend" id="legend"></ul>
  </section>
</main>

<nav id="tabs">
  <button type="button" aria-current="true"><span>Planets</span></button>
  <button type="button"><span>Moon</span></button>
  <button type="button"><span>Sky</span></button>
</nav>

    const pic = (id === 'Sun' ? '' : `<circle r="${f2(dd / 2 + 1.4)}" fill="${NIGHT}"/>`)
      + (s ? `<image href="${s.src}" x="${f2(-w / 2)}" y="${f2(-h / 2)}" width="${f2(w)}" height="${f2(h)}"/>` : `<circle r="${dd / 2}" fill="${BODY[id].c}"/>`);
    return `<g class="bd" data-id="${id}"${at ? ` transform="translate(${f2(at[0])} ${f2(at[1])})"` : ''}>${id === 'Moon' ? `<g class="sm">${pic}</g>` : pic}</g>`;
  };
  /* the Moon is far too near to draw to scale, so it rides a small ring round the Earth, always in
     its true direction. Its trail is drawn once, for a Moon standing at 0°, and then turned as a whole
     (.mr). The same turned frame holds the smear that stands in for the Moon while it races (.mb). */
  const m0 = pol(0, RM);
  const arc0 = w => { const a = pol(-w, RM); return `M${f2(a[0])} ${f2(a[1])}A${f2(RM)} ${f2(RM)} 0 ${w > 180 ? 1 : 0} 0 ${f2(m0[0])} ${f2(m0[1])}`; };   // the last w° of the ring before 0°
  const moonTrail = `<g class="tr" data-id="Moon" fill="none"><g class="mr"><g class="mt" stroke="${BODY.Moon.c}" stroke-opacity="${MFADE.add}">`
    + MFADE.w.map(w => `<path d="${arc0(w)}"/>`).join('')
    + `</g><path class="mb" stroke="${MOON_GREY}" stroke-width="${BODY.Moon.d}" style="display:none"/></g></g>`;
  V.Moon = { at: lon => pol(lon, RM), arc: arc0, r: RM, pivot: f2(cx) + ' ' + f2(cy), shown: -1, last: Infinity };
  svg.innerHTML = `<defs><radialGradient id="sk-eg"><stop offset="0" stop-color="${BODY.Earth.c}" stop-opacity=".28"/><stop offset="1" stop-color="${BODY.Earth.c}" stop-opacity="0"/></radialGradient></defs>`
    + `${ring}${text}<g fill="none" stroke-linejoin="round">${trails}</g>`
    + `<circle cx="${cx}" cy="${cy}" r="17" fill="url(#sk-eg)"/>${body('Earth', [cx, cy])}${moonTrail}${body('Moon')}${PLANETS.concat('Sun').map(id => body(id)).join('')}`
    + `<circle class="fr" r="0" fill="none" stroke="${IVORY}" stroke-opacity=".75" stroke-width="1"/>`;
  $$('.tr', svg).forEach(g => { const v = V[g.dataset.id]; v.g = g; v.an = $('.an', g); $$('.rr', g).forEach((el, k) => { v.runs[k].el = el; }); });
  $$('.bd', svg).forEach(g => { (V[g.dataset.id] || (V[g.dataset.id] = {})).body = g; });
  V.Moon.frame = $('.mr', svg); V.Moon.arcs = $$('.mt path', svg); V.Moon.blur = $('.mb', svg); V.Moon.disc = $('.sm', svg); V.ring = $('.fr', svg);
  sky.view = V;
  applySky();
}
/* show the first `prog` share of the year: trail lengths, planet positions, focus.
   States: start (a year ago, nothing drawn yet) → play (lines growing) → done (resting, faded trails). */
function applySky() {
  const V = sky.view; if (!V) return;
  const P = sky.prog, F = sky.focus, hits = [];
  $('#sky').setAttribute('data-state', sky.playing ? 'play' : P >= 1 ? 'done' : 'start');
  {
    /* the Moon: where it stood at this moment of the year, and as much of its trail as it has drawn by then */
    const M = V.Moon, tn = sky.data.Moon.turn, fi = (tn.length - 1) * P, i = Math.min(tn.length - 2, Math.floor(fi));
    const lon = tn[i] + (tn[i + 1] - tn[i]) * (fi - i), at = M.at(lon), gone = lon - tn[0];
    M.body.setAttribute('transform', `translate(${f2(at[0])} ${f2(at[1])})`);
    M.frame.setAttribute('transform', `rotate(${f2(-norm(lon))} ${M.pivot})`);
    let k = 0; while (k < M.arcs.length && MFADE.w[k] > gone) k++;        // arcs longer than the way travelled stay hidden
    if (k !== M.shown) { M.arcs.forEach((el, j) => { el.style.display = j < k ? 'none' : ''; }); M.shown = k; }
    /* In the fast part of the replay the Moon covers several times its own width between two frames.
       Drawn sharp it would flicker as a ring of separate Moons, so it is smeared over the stretch it
       has just covered, the way a camera would catch it: a band as wide as the Moon, the fainter the
       longer it is. Bands of successive frames join end to end, so together they read as one motion.
       The picture gives way to the band between half a Moon's width and two widths per frame. */
    const D = BODY.Moon.d, step = sky.playing ? clamp(lon - M.last, 0, 340) : 0, way = step * Math.PI / 180 * M.r;
    const band = D / (D + way) * clamp(way / (.75 * D) - 1, 0, 1);
    M.last = lon;
    M.disc.setAttribute('opacity', (1 - .88 * clamp((way - D / 2) / (1.5 * D), 0, 1)).toFixed(3));
    if (band > 0) { M.blur.setAttribute('d', M.arc(step)); M.blur.setAttribute('stroke-opacity', band.toFixed(3)); }
    M.blur.style.display = band > 0 ? '' : 'none';
    const dim = F && F !== 'Moon';
    M.g.style.opacity = dim ? .2 : 1; M.g.classList.toggle('on', F === 'Moon'); M.body.style.opacity = dim ? .4 : 1;
    hits.push({ id: 'Moon', x: at[0], y: at[1], d: BODY.Moon.d });
  }
  TRAILS.forEach(id => {
    const v = V[id], fi = (v.n - 1) * P, i = Math.min(v.n - 2, Math.floor(fi)), fr = fi - i;
    const len = v.cum[i] + (v.cum[i + 1] - v.cum[i]) * fr;
    const x = v.xy[i][0] + (v.xy[i + 1][0] - v.xy[i][0]) * fr, y = v.xy[i][1] + (v.xy[i + 1][1] - v.xy[i][1]) * fr;
    /* the growing line: a single dash from the start of the path up to the planet */
    if (P >= 1) v.an.removeAttribute('stroke-dasharray'); else v.an.setAttribute('stroke-dasharray', f2(len) + ' ' + f2(v.total + 2));
    v.an.style.display = len > 0 ? '' : 'none';
    v.runs.forEach(R => {
      const vis = clamp(len - R.c0, 0, R.len);
      R.el.style.display = vis > 0 ? '' : 'none';
      if (vis >= R.len) R.el.removeAttribute('stroke-dasharray'); else R.el.setAttribute('stroke-dasharray', f2(vis) + ' ' + f2(R.len + 2));
    });
    v.body.setAttribute('transform', `translate(${f2(x)} ${f2(y)})`);
    const dim = F && F !== id;
    v.g.style.opacity = dim ? .2 : 1; v.g.classList.toggle('on', F === id); v.body.style.opacity = dim ? .4 : 1;
    hits.push({ id, x, y, d: BODY[id].d });
  });
  const h = F && hits.find(o => o.id === F);
  V.ring.setAttribute('r', h ? f2(h.d / 2 + 5) : 0);
  if (h) { V.ring.setAttribute('cx', f2(h.x)); V.ring.setAttribute('cy', f2(h.y)); }
  sky.hits = hits;
}
const skyRange = now => dm(now - 365 * DAY) + yy(now - 365 * DAY) + ' – ' + dm(now) + yy(now);
/* replay the year: trails grow from a year ago to today */
function playSky() {
  if (CALM || !sky.view) return;
  cancelAnimationFrame(sky.raf); sky.playing = true; sky.prog = 0;
  const t0 = performance.now(), el = $('#date3'), end = sky.t;
  const step = t => {
    const u = clamp((t - t0) / 2200, 0, 1);
    sky.prog = u < 1 ? .5 - Math.cos(Math.PI * u) / 2 : 1;
    if (u >= 1) sky.playing = false;                    // last frame: switch to the resting, faded trails
    applySky();
    if (u < 1) { const d = end - 365 * DAY * (1 - sky.prog); el.textContent = dm(d) + yy(d); sky.raf = requestAnimationFrame(step); }
    else el.textContent = skyRange(nowMs());
  };
  sky.raf = requestAnimationFrame(step);
}
/* rewind while the page is out of sight, so the next visit starts from a year ago */
function rewindSky() {
  if (CALM || (!sky.playing && sky.prog === 0)) return;
  cancelAnimationFrame(sky.raf); sky.playing = false; sky.prog = 0;
  applySky(); $('#date3').textContent = skyRange(nowMs());
}
function renderLegend(now) {
  if (!sky.playing) $('#date3').textContent = skyRange(now);
  const el = $('#legend');
  el.className = 'legend' + (sky.focus ? ' has-focus' : '');
  el.innerHTML = ALL.map(id => {
    const retro = (planetInfo.find(p => p.id === id) || {}).retro, lon = lonOf(id, now);
    return `<li><button type="button" data-id="${id}" class="${sky.focus === id ? 'on' : ''}" aria-pressed="${sky.focus === id}"><span class="ic">${pl(id, 14)}</span><span class="tx"><b>${T.body[id]}${retro ? RX : ''}</b>`
      + `<span class="sg">${zg(signOf(lon))}<span class="sn">${T.sign[signOf(lon)]} ${degIn(lon)}°</span></span></span></button></li>`;
  }).join('');
}
function setFocus(id) { sky.focus = sky.focus === id ? null : id; renderLegend(nowMs()); applySky(); }

/* ── faint star field (vector, so it stays sharp when zoomed) ── */
function drawStars() {
  const el = $('#stars'), w = innerWidth, h = innerHeight;
  let a = 20261115, s = '';
  const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  for (let i = Math.round(w * h / 3800); i--;) {
    const x = rnd() * w, y = rnd() * h, r = .35 + Math.pow(rnd(), 3) * .85, al = .08 + Math.pow(rnd(), 2) * .42;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="${rnd() < .2 ? '#aabeff' : IVORY}" fill-opacity="${al.toFixed(2)}"/>`;
  }
  el.setAttribute('viewBox', `0 0 ${w} ${h}`); el.innerHTML = s;
}

/* ── language switch, pager, tabs, events ── */
const pager = $('#pager'), tabs = $$('#tabs button');
const WIDE = () => innerWidth >= 1280;                 // three panels side by side
function applyLang() {
  T = TX[lang];
  document.documentElement.lang = T.html;
  tabs.forEach((b, k) => { b.firstElementChild.textContent = T.tabs[k]; });
  $('#tabs').setAttribute('aria-label', T.pages);
  $$('.lang').forEach(el => el.setAttribute('aria-label', T.lang));
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false'));
  $$('.cal-h button').forEach(b => b.setAttribute('aria-label', +b.dataset.d < 0 ? T.prev : T.next));
  $('#sky').setAttribute('aria-label', T.map);
  buildAxis();
}
function renderAll(force) {
  const now = nowMs();
  renderPlanets(now); renderMoon(now, force);
  if (sky.data) { renderLegend(now); renderSky(); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('.lang button'); if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (err) { /* not remembered, still switches */ }
  applyLang(); renderAll(true);
});
const NAMES = ['#planets', '#moon', '#sky'];
let cur = -1;
function sync() {
  const x = pager.scrollLeft / pager.clientWidth, i = clamp(Math.round(x), 0, 2);
  tabs.forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
  if (!WIDE()) {
    if (i === 2 && cur !== 2) playSky();               // every arrival on the sky page replays the year
    else if (i !== 2 && x <= 1.02) rewindSky();        // fully out of sight: get ready for the next visit
  }
  cur = i;
}
pager.addEventListener('scroll', () => requestAnimationFrame(sync), { passive: true });
tabs.forEach((b, k) => b.addEventListener('click', () => pager.scrollTo({ left: k * pager.clientWidth, behavior: 'smooth' })));
$('#cal-g').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  cal.sel = +b.dataset.n; $$('#cal-g .sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); calDetail();
});
$$('.cal-h button').forEach(b => b.addEventListener('click', () => {
  const d = new Date(cal.y, cal.m + (+b.dataset.d), 1); cal.y = d.getFullYear(); cal.m = d.getMonth(); renderCal();
}));
$('#legend').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFocus(b.dataset.id); });
$('#sky').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 22;
  sky.hits.forEach(o => { const d = Math.hypot(o.x - x, o.y - y); if (d < bd) { bd = d; best = o.id; } });
  if (best) setFocus(best); else if (sky.focus) setFocus(sky.focus); else playSky();   // empty spot: replay
});

function tick() {
  const now = nowMs(), first = !sky.data;
  renderPlanets(now); renderMoon(now);
  const fresh = first || Math.abs(now - sky.t) > 3 * 36e5;
  if (fresh && !sky.playing) { buildSky(now); renderSky(); }
  renderLegend(now);
  if (first && (WIDE() || cur === 2)) playSky();
}
applyLang();
{ const now = nowMs(); renderPlanets(now); renderMoon(now); $('#date3').textContent = skyRange(now); }
drawStars();
const start = NAMES.indexOf(location.hash);
if (start > 0) pager.scrollLeft = start * pager.clientWidth;
cur = clamp(Math.round(pager.scrollLeft / pager.clientWidth), 0, 2);
tabs.forEach((b, k) => b.setAttribute('aria-current', k === cur ? 'true' : 'false'));
if (window.performance && performance.mark) performance.mark('first-view');
setTimeout(() => { tick(); if (window.performance && performance.mark) performance.mark('sky-built'); }, 30);
setInterval(tick, 6e4);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawStars(); renderSky(); }, 120); });
})();
</script>
